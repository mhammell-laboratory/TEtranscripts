name: Python tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.py
      - name: Install package
        run: python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Exercise exact-test performance guard
        if: matrix.python-version == '3.12'
        run: >-
          python tests/benchmarks/benchmark_exact_test.py
          --features 25
          --repeats 2
          --assert-max-seconds 5

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: setup.py
      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install and smoke-test the wheel in isolation
        run: |
          python -m venv "$RUNNER_TEMP/tetranscripts-wheel"
          "$RUNNER_TEMP/tetranscripts-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/tetranscripts-wheel/bin/TEtranscripts" --version | grep '2.2.4'
          "$RUNNER_TEMP/tetranscripts-wheel/bin/TEcount" --version | grep '2.2.4'
          "$RUNNER_TEMP/tetranscripts-wheel/bin/python" -c 'import TEToolkit.DifferentialAnalysis'

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build container image
        run: >-
          docker build
          --build-arg VCS_REF="$GITHUB_SHA"
          --tag tetranscripts:test
          .
      - name: Smoke-test both installed CLIs
        run: |
          docker run --rm tetranscripts:test --version | grep '2.2.4'
          docker run --rm --entrypoint TEcount tetranscripts:test --version | grep '2.2.4'
      - name: Verify the native runtime
        run: |
          docker run --rm --entrypoint python tetranscripts:test -c 'import TEToolkit.DifferentialAnalysis'
          docker run --rm --entrypoint sh tetranscripts:test -c '! command -v R && ! command -v Rscript'
      - name: Verify non-root execution and writable work directory
        run: |
          docker run --rm --entrypoint python tetranscripts:test -c 'import os; assert os.getuid() == 10001'
          docker run --rm --entrypoint python tetranscripts:test -c 'from pathlib import Path; Path("container-write-test").write_text("ok"); assert Path("container-write-test").read_text() == "ok"'
      - name: Verify image metadata
        run: |
          test "$(docker inspect --format '{{.Config.User}}' tetranscripts:test)" = 'tetranscripts'
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' tetranscripts:test)" = 'https://github.com/molikd/TEtranscripts'
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' tetranscripts:test)" = "$GITHUB_SHA"

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Python-native package
        run: python -m pip install .
      - name: Install legacy DESeq2 runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends r-base r-bioc-deseq2
      - name: Compare legacy and native results
        run: |
          mkdir -p "$RUNNER_TEMP/comparison"
          for counts in \
            tests/compatibility/small_counts.cntTable \
            tests/compatibility/fixtures/pasilla_subsample.cntTable \
            tests/compatibility/fixtures/airway_subsample.cntTable
          do
            fixture="$(basename "$counts" .cntTable)"
            python tests/compatibility/compare_legacy_and_native.py \
              --legacy-revision 32426b94d2d8ed0ebaca011feec86cc62df61e6c \
              --counts "$counts" \
              --output-dir "$RUNNER_TEMP/comparison/$fixture" \
              --report "$RUNNER_TEMP/comparison/$fixture.md" \
              --min-padj-spearman 0.85 \
              --min-significant-jaccard 0.60
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-native-comparison
          path: ${{ runner.temp }}/comparison
